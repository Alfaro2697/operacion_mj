name: Deploy Operacion MJ

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
      - name: Comprobar index.html en la raiz
        run: |
          test -f index.html || (echo "ERROR: falta index.html en la raiz del repositorio" && exit 1)
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir el sitio (raiz del repositorio)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
